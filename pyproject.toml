[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-repo-kit"
version = "0.1.0"
description = "Scaffold launch-ready, AI-agent-friendly open-source repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ukyo" }
]
keywords = ["ai-agents", "developer-tools", "scaffold", "template", "open-source", "cli", "codex", "claude-code"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Utilities"
]
dependencies = []

[project.scripts]
agent-repo-kit = "agent_repo_kit.cli:main"

[project.urls]
Homepage = "https://github.com/Uky0Yang/agent-repo-kit"
Issues = "https://github.com/Uky0Yang/agent-repo-kit/issues"
