name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m agent_repo_kit list
      - run: python -m agent_repo_kit create smoke-demo --output-dir /tmp --template python-cli
      - run: cd /tmp/smoke-demo && python -m unittest discover -s tests
